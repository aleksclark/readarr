name: Metadata Tests

on:
  push:
    branches: [develop, revitalize]
    paths:
      - "src/NzbDrone.Core/MetadataSource/**"
      - "src/NzbDrone.Core/Books/**"
      - "src/NzbDrone.Core.Test/MetadataSource/**"
  pull_request:
    branches: [develop]
    paths:
      - "src/NzbDrone.Core/MetadataSource/**"
      - "src/NzbDrone.Core/Books/**"
      - "src/NzbDrone.Core.Test/MetadataSource/**"

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  metadata-unit-tests:
    name: Metadata Source Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-linux-

      - name: Restore & Build
        run: dotnet build src/Readarr.sln -c Release

      - name: Run Metadata Tests
        run: >
          dotnet test src/NzbDrone.Core.Test/Readarr.Core.Test.csproj
          --no-build
          -c Release
          --filter "FullyQualifiedName~MetadataSource|FullyQualifiedName~Books.Services"
          --logger "trx;LogFileName=metadata-tests.trx"
          --results-directory ./TestResults

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-test-results
          path: ./TestResults
          retention-days: 7

  open-library-integration:
    name: Open Library Integration Tests
    runs-on: ubuntu-24.04
    # Only run on push to avoid API rate limits on PRs
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-linux-

      - name: Restore & Build
        run: dotnet build src/Readarr.sln -c Release

      - name: Verify OL Search Returns Results
        run: |
          # Quick sanity check that OL API is responding
          result=$(curl -s "https://openlibrary.org/search.json?q=tolkien&limit=3&fields=key,title,author_name")
          count=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin)['numFound'])")
          echo "Open Library search returned $count results for 'tolkien'"
          if [ "$count" -lt "1" ]; then
            echo "❌ OL API appears down or broken"
            exit 1
          fi
          echo "✅ OL API responding correctly"

      - name: Verify OL Data Mapping
        run: |
          # Test that a known work returns expected structure
          work=$(curl -s "https://openlibrary.org/works/OL27448W.json")
          title=$(echo "$work" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))")
          echo "Work OL27448W title: $title"
          if [ "$title" != "The Lord of the Rings" ]; then
            echo "❌ Unexpected title for OL27448W: $title"
            exit 1
          fi
          echo "✅ Work data mapping verified"

      - name: Verify OL Author Data
        run: |
          author=$(curl -s "https://openlibrary.org/authors/OL26320A.json")
          name=$(echo "$author" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name',''))")
          echo "Author OL26320A: $name"
          if [[ "$name" != *"Tolkien"* ]]; then
            echo "❌ Unexpected author name: $name"
            exit 1
          fi
          echo "✅ Author data mapping verified"

      - name: Verify OL Editions Endpoint
        run: |
          editions=$(curl -s "https://openlibrary.org/works/OL27448W/editions.json?limit=5")
          size=$(echo "$editions" | python3 -c "import sys,json; print(json.load(sys.stdin).get('size',0))")
          echo "Editions count for OL27448W: $size"
          if [ "$size" -lt "1" ]; then
            echo "❌ No editions found"
            exit 1
          fi
          echo "✅ Editions endpoint verified ($size editions)"

      - name: Verify ISBN Lookup
        run: |
          # ISBN for "The Hobbit" paperback
          response=$(curl -s -w "\n%{http_code}" -L "https://openlibrary.org/isbn/9780547928227.json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          title=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))" 2>/dev/null || echo "parse_error")
          echo "ISBN 9780547928227 → $title (HTTP $http_code)"
          if [ "$http_code" != "200" ]; then
            echo "⚠️ ISBN lookup returned $http_code (may be redirect)"
          fi
          echo "✅ ISBN lookup verified"
